[project]
name = "backup-keepass-unlock"
version = "0.1.0"
description = "Backup tool using borg and KeePass for password management"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "AlexAndrewsAI", email = "alex.andrews.ai@protonmail.com"}
]
keywords = ["backup", "borg", "keepass"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",  # Added
]

dependencies = [
    "pydantic>=2.0",
    "typer>=0.12.0",
    "pyyaml>=6.0",
    "keepass-wrapper @ git+https://github.com/AlexAndrewsAI/keepass-wrapper.git",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff",
    "mypy",
]

[project.scripts]
backup-keepass-unlock = "backup_keepass_unlock.cli:app"

[project.urls]
Homepage = "https://github.com/AlexAndrewsAI/backup-keepass-unlock"
Repository = "https://github.com/AlexAndrewsAI/backup-keepass-unlock.git"
Documentation = "https://github.com/AlexAndrewsAI/backup-keepass-unlock#readme"

[tool.uv]

[tool.ruff]
line-length = 88
target-version = "py310"
[tool.ruff.lint]
select = ["E", "F", "W", "I", "C4", "UP", "ARG", "RUF", "SIM"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
