# Keepass database
database_path: tests/test.kdbx
# Test backup configuration
profiles:
  test-backup:
    type: borg
    title: borg
    input:
      - tests/dir
    output: tests/borg
    arguments: ["create", "--progress", "--json", "--filter=AME", "-C", "lz4"]
    exclude:
      - tests/dir/excludeme
    must_exist:
      - tests/dir/README.md
  test2:
    type: borg
    title: borg
    input:
      - tests/dir
    output: tests/borg
    arguments: ["create", "--progress", "--json", "--filter=AME", "-C", "lz4"]
    exclude: []
    must_exist:
      - tests/dir/README.md
